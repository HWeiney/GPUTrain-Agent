services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ../backend/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../backend/sql/gputrain_menu.sql:/docker-entrypoint-initdb.d/03-gputrain-menu.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
