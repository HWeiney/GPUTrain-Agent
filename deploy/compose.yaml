services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../backend/sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ../backend/sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../backend/sql/gputrain_menu.sql:/docker-entrypoint-initdb.d/03-gputrain-menu.sql:ro
      - ../backend/sql/gputrain_ssh_baseline.sql:/docker-entrypoint-initdb.d/04-gputrain-ssh-baseline.sql:ro
      - ../backend/sql/gputrain_phase8_ssh_servers.sql:/docker-entrypoint-initdb.d/05-gputrain-ssh-servers.sql:ro
      - ../backend/sql/gputrain_phase9_ssh_jobs.sql:/docker-entrypoint-initdb.d/06-gputrain-ssh-jobs.sql:ro
      - ../backend/sql/gputrain_phase6.sql:/docker-entrypoint-initdb.d/07-gputrain-mcp.sql:ro
      - ../backend/sql/gputrain_phase10_terminal.sql:/docker-entrypoint-initdb.d/08-gputrain-terminal.sql:ro
      - ../backend/sql/gputrain_phase11_proposals.sql:/docker-entrypoint-initdb.d/09-gputrain-proposals.sql:ro
      - ../backend/sql/gputrain_phase12_proposal_rationale.sql:/docker-entrypoint-initdb.d/10-gputrain-proposal-rationale.sql:ro
      - ../backend/sql/gputrain_phase13_agent_memory.sql:/docker-entrypoint-initdb.d/11-gputrain-agent-memory.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
